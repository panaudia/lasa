<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LASA minimal</title>
    <style>
      body { font: 15px/1.4 system-ui, sans-serif; margin: 2rem auto; max-width: 40rem; padding: 0 1rem; }
      label { display: block; margin: 0.5rem 0; }
      input { width: 100%; box-sizing: border-box; padding: 0.3rem; }
      button { padding: 0.4rem 1rem; margin-right: 0.5rem; }
      #status { margin-left: 0.5rem; color: #666; }
      table { border-collapse: collapse; margin-top: 1rem; width: 100%; }
      td, th { text-align: left; padding: 0.2rem 0.6rem 0.2rem 0; font-variant-numeric: tabular-nums; }
      .me { font-weight: 600; }
    </style>
  </head>
  <body>
    <h1>LASA minimal</h1>
    <p>Join a space, talk, listen, see who is there. Open a second tab with a different client id for company.</p>

    <form id="join-form">
      <label>Space URL <input id="url" value="https://127.0.0.1:4443/lasa" /></label>
      <label>Space id <input id="space" value="main" /></label>
      <label>Client id <input id="client" placeholder="alice" required /></label>
      <label>Dev certificate hash (base64 SHA-256 from the server log; blank with a trusted certificate)
        <input id="cert-hash" /></label>
      <button id="join" type="submit">Join</button>
      <button id="leave" type="button" disabled>Leave</button>
      <span id="status">not connected</span>
    </form>

    <table>
      <thead><tr><th>Entity</th><th>Name</th><th>x</th><th>y</th><th>Level</th></tr></thead>
      <tbody id="roster"></tbody>
    </table>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
